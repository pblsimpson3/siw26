<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin The Water Wheel Gameshow</title>
    <link rel="stylesheet" href="../css/5end/endgameshow.css">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
</head>
<body>

    <main>
        <header class="gameshow-header">
            <h1 class="neon-text">SPIN THE WATER WHEEL</h1>
        </header>

        <div class="gameshow-layout">
            
            <div class="host-column">
                <img src="../images/end/LanceDeGabbro_host.jpg" alt="Lance DeGabbro, the Gameshow Host" class="host-img">
            </div>

            <div class="content-column">
                <div class="speech-bubble">
                    <p>I'm Lance DeGabbro, your host. You're a contestant on <strong>SPIN THE WATER WHEEL</strong>, the favorite game show of 1650 Hammersmith Village. You have chosen the Saugus Iron Works as your question category. <strong>GOOD LUCK!</strong></p>
                </div>

                <div class="audio-player-section">
                    <div class="audio-icon">
                        <img src="../images/introduction/ear_icon.gif" alt="Listen to Lance" class="ear-icon">
                    </div>
                    <div class="audio-controls">
                        <p class="audio-label">Listen to Lance:</p>
                        <audio id="gameshowAudio" controls preload="metadata">
                            <source src="../media/Spin_The_Water_Wheel_.mp3" type="audio/mpeg">
                            Your browser does not support the audio element.
                        </audio>
                    </div>
                </div>

                <div class="gif-row">
                    <img src="../images/end/game_booth.gif" alt="Game Booth animation" class="gameshow-gif">
                    <img src="../images/end/wow_rotates.gif" alt="Wow animation" class="gameshow-gif">
                </div>

                <div class="action-row">
                    <img src="../images/end/clown_next.gif" alt="Clown pointing to the button" class="clown-gif">
                    
                    <a href="endgameshow2.html" class="push-button-link" aria-label="Push to start the game">
                        <div class="push-button">
                            <span class="push-text">PUSH</span>
                        </div>
                    </a>
                </div>
            </div>
        </div>

        <footer class="navigation">
            <div class="nav-item">
                <a href="../process.html" class="nav-button up" aria-label="Up to Adventure Choices">
                    <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
                        <path d="M 10 26 L 20 14 L 30 26" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>
                <span class="nav-label">Adventure<br>Choices</span>
            </div>
        </footer>
    </main>

</body>
</html>
